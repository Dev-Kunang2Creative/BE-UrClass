name: Bootstrap + first deploy (one-time)

# Run this ONCE, manually, from the Actions tab.
#
# Prerequisite (one command on the server, see DEPLOY.md): the CI deploy
# public key must be in ~/.ssh/authorized_keys. Everything after that is
# automated here: directories, .env, app files, migrations, caches, and a
# verification pass against the live URL.
#
# After this succeeds, deploy.yml takes over every push to main and never
# touches the database again.

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run migrations (required once - the API 500s without the sessions/cache/jobs tables)'
        type: boolean
        default: true

concurrency:
  group: deploy-prod-api
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Provision, deploy, verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_URL: https://prod-api.urclass.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          miss=0
          for v in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY PROD_ENV; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is not set"; miss=1; fi
          done
          [ "$miss" = 0 ] || exit 1
          echo "DEPLOY_PATH=/home/$SSH_USER/domains/prod-api.urclass.id/public_html" >> "$GITHUB_ENV"

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, gd, zip, intl, pdo_mysql, curl, dom, fileinfo, exif, xml
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies (production)
        run: |
          cp .env.example .env
          composer install --no-dev --optimize-autoloader --classmap-authoritative \
                           --prefer-dist --no-interaction --no-progress

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

          # Fail with a readable message instead of a cryptic ssh error if the
          # runner cannot even open the port.
          echo "--- tcp reachability"
          if timeout 20 bash -c "cat < /dev/null > /dev/tcp/$SSH_HOST/$SSH_PORT" 2>/dev/null; then
            echo "port is open from this runner"
          else
            echo "::error::cannot open $SSH_HOST:$SSH_PORT from this runner - \
          check the SSH_HOST/SSH_PORT secrets and whether the host firewall \
          allows GitHub Actions egress."
            exit 1
          fi

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "host key pinned from SSH_KNOWN_HOSTS"
            echo 'SSH_OPTS=-o StrictHostKeyChecking=yes' >> "$GITHUB_ENV"
          else
            echo "::warning::SSH_KNOWN_HOSTS not set - trusting the host key on first use."
            # Best effort only. ssh-keyscan exiting non-zero must not kill the
            # step (the shell runs with -e), and its stderr is kept visible.
            if ssh-keyscan -T 15 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts; then
              echo "host key collected: $(wc -l < ~/.ssh/known_hosts) entries"
            else
              echo "ssh-keyscan failed (exit $?) - falling back to accept-new"
            fi
            echo 'SSH_OPTS=-o StrictHostKeyChecking=accept-new' >> "$GITHUB_ENV"
          fi

      - name: Provision directories
        id: provision
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # `bash -s` reads the script from stdin, so stdin cannot also carry
          # data. The .env body is shipped with scp in the next step instead.
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE' > "$RUNNER_TEMP/provision.log" 2>&1 || { cat "$RUNNER_TEMP/provision.log"; exit 1; }
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"
          mkdir -p storage/framework/cache/data storage/framework/sessions \
                   storage/framework/views storage/framework/testing \
                   storage/logs storage/app/public storage/app/private \
                   bootstrap/cache
          chmod -R 775 storage bootstrap/cache
          if [ -s .env ]; then echo "ENV_PRESENT"; else echo "ENV_MISSING"; fi
          echo "provision OK"
          REMOTE
          cat "$RUNNER_TEMP/provision.log"
          if grep -q ENV_MISSING "$RUNNER_TEMP/provision.log"; then
            echo "env_missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "env_missing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::.env already exists on the server - left untouched."
          fi

      - name: Upload .env (first time only)
        if: steps.provision.outputs.env_missing == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          # Written to a file and scp'd so the secret never appears in argv
          # (a process list on shared hosting would otherwise expose it).
          umask 077
          printf '%s\n' "$PROD_ENV" > "$RUNNER_TEMP/prod.env"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" $SSH_OPTS -q \
            "$RUNNER_TEMP/prod.env" "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/.env"
          rm -f "$RUNNER_TEMP/prod.env"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "chmod 600 '$DEPLOY_PATH/.env' && wc -l < '$DEPLOY_PATH/.env'"
          echo ".env uploaded"

      - name: Deploy files (rsync)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -rlptz --delete --human-readable --stats \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT $SSH_OPTS" \
            --exclude-from=.deployignore \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Migrate, link storage, build caches
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RUN_MIGRATIONS='$RUN_MIGRATIONS' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          php_bin=""
          for c in /opt/alt/php83/usr/bin/php /opt/alt/php84/usr/bin/php \
                   /usr/bin/php8.3 /usr/bin/php8.2 /usr/local/bin/php /usr/bin/php; do
            [ -x "$c" ] || continue
            v=$("$c" -r 'echo PHP_VERSION_ID;' 2>/dev/null || echo 0)
            if [ "${v:-0}" -ge 80200 ]; then php_bin="$c"; break; fi
          done
          [ -n "$php_bin" ] || { echo "no PHP >= 8.2 CLI found"; exit 1; }
          echo "php cli: $php_bin ($("$php_bin" -r 'echo PHP_VERSION;'))"

          # NOT optimize:clear - that also runs cache:clear, which with
          # CACHE_STORE=database issues `delete from cache`. On a fresh
          # database that table does not exist yet, so it must not run
          # before migrate. These clears are all file-based.
          echo "--- clear file caches"
          "$php_bin" artisan config:clear
          "$php_bin" artisan route:clear
          "$php_bin" artisan view:clear
          "$php_bin" artisan event:clear
          "$php_bin" artisan clear-compiled

          if [ "$RUN_MIGRATIONS" = "true" ]; then
            echo "--- migrate"
            "$php_bin" artisan migrate --force
          else
            echo "--- migrations skipped by input"
          fi

          # Safe only once the schema exists; still tolerated if it is not.
          "$php_bin" artisan cache:clear || echo "cache:clear skipped (no schema yet)"

          # NOT `artisan storage:link`. This host disables both symlink() and
          # exec() in PHP, so Laravel's Filesystem::link() dies with
          # "Call to undefined function exec()". The shell has ln, so link it
          # directly. This matters: the app serves every upload through
          # Storage::disk('public')->url(), which resolves to public/storage.
          if [ -e public/storage ]; then
            echo "public/storage already present"
          else
            ln -s ../storage/app/public public/storage
            echo "public/storage -> $(readlink public/storage)"
          fi

          "$php_bin" artisan config:cache
          "$php_bin" artisan route:cache
          "$php_bin" artisan view:cache
          "$php_bin" artisan event:cache
          echo "post-deploy OK"
          REMOTE

      - name: Verify the API is reachable
        run: |
          fail=0
          JSON='-H Accept:application/json'
          probe() { # label, expected status, curl args...
            label="$1"; want="$2"; shift 2
            code=$(curl -s -o /tmp/body -w '%{http_code}' "$@")
            if [ "$code" = "$want" ]; then
              echo "  PASS  $label  -> $code"
            else
              echo "  FAIL  $label  -> $code (expected $want)"
              head -c 300 /tmp/body; echo
              fail=1
            fi
          }
          echo "===== verification ====="

          probe "/up               php + laravel boot + rewrite chain" 200 \
            "$BASE_URL/up"

          probe "/                 database sessions + vite assets"    200 \
            "$BASE_URL/"

          # Accept: application/json matters. Without it Laravel's
          # unauthenticated handler redirects to route('login'), which this
          # API does not define, and a 500 is returned instead of a 401.
          probe "/api/auth/me      api routing + sanctum guard"        401 \
            $JSON "$BASE_URL/api/auth/me"

          # Reaches the users table, so this proves the API talks to MySQL.
          probe "/api/auth/login   api -> database (bad creds)"        422 \
            $JSON -X POST \
            -d 'email=deploy-probe@example.invalid' -d 'password=wrong' \
            "$BASE_URL/api/auth/login"

          probe "/.env             secrets not web-readable"           403 \
            "$BASE_URL/.env"

          probe "/vendor/...       app dirs not web-readable"          403 \
            "$BASE_URL/vendor/autoload.php"

          [ "$fail" = 0 ] || { echo "::error::verification failed"; exit 1; }
          echo "===== API is live ====="

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
