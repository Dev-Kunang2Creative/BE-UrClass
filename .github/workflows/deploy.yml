name: Deploy prod-api.urclass.id

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys rsync into the same directory at once.
concurrency:
  group: deploy-prod-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # DEPLOY_PATH is derived from the SSH_USER secret in the step below -
      # this repo is public, so the hosting username stays out of it.
      BASE_URL: https://prod-api.urclass.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy path
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          test -n "$SSH_USER" || { echo "::error::secret SSH_USER is not set"; exit 1; }
          echo "DEPLOY_PATH=/home/$SSH_USER/domains/prod-api.urclass.id/public_html" >> "$GITHUB_ENV"

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, gd, zip, intl, pdo_mysql, curl, dom, fileinfo, exif, xml
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies (production)
        run: |
          # Placeholder .env so `artisan package:discover` can boot during
          # composer's post-autoload-dump. It is excluded from rsync, so the
          # real server .env is never overwritten.
          cp .env.example .env
          composer install \
            --no-dev \
            --optimize-autoloader \
            --classmap-authoritative \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        # routes/web.php renders welcome.blade.php which uses @vite,
        # so public/build must exist or "/" throws a manifest error.
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

          echo "--- tcp reachability"
          if timeout 20 bash -c "cat < /dev/null > /dev/tcp/$SSH_HOST/$SSH_PORT" 2>/dev/null; then
            echo "port is open from this runner"
          else
            echo "::error::cannot open $SSH_HOST:$SSH_PORT from this runner."
            exit 1
          fi

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            # Pinned host key (preferred).
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo 'SSH_OPTS=-o StrictHostKeyChecking=yes' >> "$GITHUB_ENV"
          else
            echo "::warning::SSH_KNOWN_HOSTS not set - trusting host key on first use (TOFU)."
            # Best effort: the shell runs with -e, so a failing keyscan must not
            # abort the step, and its stderr stays visible for diagnosis.
            if ssh-keyscan -T 15 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts; then
              echo "host key collected: $(wc -l < ~/.ssh/known_hosts) entries"
            else
              echo "ssh-keyscan failed (exit $?) - falling back to accept-new"
            fi
            echo 'SSH_OPTS=-o StrictHostKeyChecking=accept-new' >> "$GITHUB_ENV"
          fi

      - name: Preflight checks on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          fail=0
          command -v rsync >/dev/null || { echo "MISSING: rsync on server"; fail=1; }
          [ -d "$DEPLOY_PATH" ] || { echo "MISSING: $DEPLOY_PATH"; fail=1; }
          [ -f "$DEPLOY_PATH/.env" ] || { echo "MISSING: $DEPLOY_PATH/.env (run the one-time bootstrap first)"; fail=1; }
          [ -d "$DEPLOY_PATH/storage/framework/views" ] || { echo "MISSING: storage/framework/views"; fail=1; }
          php_bin=""
          for c in /opt/alt/php83/usr/bin/php /opt/alt/php84/usr/bin/php \
                   /usr/bin/php8.3 /usr/bin/php8.2 /usr/local/bin/php /usr/bin/php; do
            [ -x "$c" ] || continue
            v=$("$c" -r 'echo PHP_VERSION_ID;' 2>/dev/null || echo 0)
            if [ "${v:-0}" -ge 80200 ]; then php_bin="$c"; break; fi
          done
          [ -n "$php_bin" ] || { echo "MISSING: no PHP >= 8.2 CLI found"; fail=1; }
          echo "php cli: ${php_bin:-none} ($("${php_bin:-echo}" -r 'echo PHP_VERSION;' 2>/dev/null || echo n/a))"
          exit $fail
          REMOTE

      - name: Deploy files (rsync)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -rlptz --delete --human-readable --stats \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT $SSH_OPTS" \
            --exclude-from=.deployignore \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Post-deploy (rebuild caches)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          php_bin=""
          for c in /opt/alt/php83/usr/bin/php /opt/alt/php84/usr/bin/php \
                   /usr/bin/php8.3 /usr/bin/php8.2 /usr/local/bin/php /usr/bin/php; do
            [ -x "$c" ] || continue
            v=$("$c" -r 'echo PHP_VERSION_ID;' 2>/dev/null || echo 0)
            if [ "${v:-0}" -ge 80200 ]; then php_bin="$c"; break; fi
          done

          # public/storage is excluded from rsync; recreate it if it is gone.
          # Not via `artisan storage:link` - this host disables symlink() and
          # exec() in PHP, so Laravel cannot create the link itself.
          if [ ! -e public/storage ]; then
            ln -s ../storage/app/public public/storage
            echo "public/storage -> $(readlink public/storage)"
          fi

          # Granular clears instead of optimize:clear: that command also runs
          # cache:clear, which with CACHE_STORE=database hits the `cache`
          # table - a DB hiccup there should not fail an otherwise fine
          # code deploy.
          "$php_bin" artisan config:clear
          "$php_bin" artisan route:clear
          "$php_bin" artisan view:clear
          "$php_bin" artisan event:clear
          "$php_bin" artisan clear-compiled
          "$php_bin" artisan cache:clear || echo "cache:clear skipped"

          "$php_bin" artisan config:cache
          "$php_bin" artisan route:cache
          "$php_bin" artisan view:cache
          "$php_bin" artisan event:cache

          # NOTE: no `artisan migrate` here by design - schema changes stay manual.
          echo "--- deployed commit: $(cat .deployed-sha 2>/dev/null || echo unknown)"
          REMOTE

      - name: Record deployed commit
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "printf '%s\n' '${{ github.sha }}' > '$DEPLOY_PATH/.deployed-sha'"

      - name: Verify the deploy
        # /up alone is not enough: in Laravel 12 the health route carries no
        # middleware, so it answers 200 even with a dead database. "/" and the
        # login probe are what actually exercise MySQL.
        run: |
          fail=0
          JSON='-H Accept:application/json'
          probe() { # label, expected status, curl args...
            label="$1"; want="$2"; shift 2
            for i in 1 2 3; do
              code=$(curl -s -o /tmp/body -w '%{http_code}' "$@")
              [ "$code" = "$want" ] && break
              sleep 5
            done
            if [ "$code" = "$want" ]; then
              echo "  PASS  $label  -> $code"
            else
              echo "  FAIL  $label  -> $code (expected $want)"
              head -c 300 /tmp/body; echo
              fail=1
            fi
          }
          echo "===== verification ====="
          probe "/up               php + laravel boot + rewrite chain" 200 "$BASE_URL/up"
          probe "/                 database sessions + vite assets"    200 "$BASE_URL/"
          probe "/api/auth/me      api routing + sanctum guard"        401 $JSON "$BASE_URL/api/auth/me"
          probe "/api/auth/login   api -> database (bad creds)"        422 $JSON -X POST \
            -d 'email=deploy-probe@example.invalid' -d 'password=wrong' "$BASE_URL/api/auth/login"
          probe "/.env             secrets not web-readable"           403 "$BASE_URL/.env"
          probe "/vendor/...       app dirs not web-readable"          403 "$BASE_URL/vendor/autoload.php"
          [ "$fail" = 0 ] || { echo "::error::deploy verification failed"; exit 1; }
          echo "===== deploy verified ====="

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
